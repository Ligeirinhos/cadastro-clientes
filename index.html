<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Insalata Saladas</title>
    <link rel="manifest" href="data:application/json,{}">
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Insalata">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%237c3aed' width='100' height='100' rx='20'/><circle cx='50' cy='38' r='16' fill='white'/><ellipse cx='50' cy='78' rx='28' ry='22' fill='white'/></svg>">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #7c3aed;
            --primary-hover: #6d28d9;
            --primary-light: #ede9fe;
            --primary-text: #ffffff;
            --bg: #ffffff;
            --bg-secondary: #f5f3ff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0d5f0;
            --card: #fff;
            --shadow: 0 2px 8px rgba(124,58,237,0.08);
            --input-bg: #fff;
            --radius: 10px;
            --danger: #c00;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #a78bfa;
                --primary-hover: #8b5cf6;
                --primary-light: #2e1065;
                --primary-text: #1e1b4b;
                --bg: #121212;
                --bg-secondary: #1e1e2f;
                --text: #e0e0e0;
                --text-secondary: #aaa;
                --border: #333;
                --card: #1e1e2f;
                --shadow: 0 2px 8px rgba(0,0,0,0.4);
                --input-bg: #2a2a3a;
            }
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; -webkit-tap-highlight-color: transparent;
        }
        .app-container { max-width:500px; margin:0 auto; display:flex; flex-direction:column; min-height:100vh; }

        .header {
            background: var(--primary); color: var(--primary-text);
            padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; z-index:100;
        }
        .header-title { font-size:1.1rem; font-weight:700; }
        .header-btn { background:rgba(255,255,255,0.2); color:inherit; border:none; width:36px; height:36px; border-radius:50%; font-size:1.2rem; cursor:pointer; }

        .tabs {
            display:flex; background: var(--bg-secondary);
            position:sticky; top:52px; z-index:90;
        }
        .tab {
            flex:1; text-align:center; padding:12px;
            font-weight:600; font-size:0.9rem; border-bottom:2px solid transparent;
            cursor:pointer; transition:0.2s; color: var(--text-secondary);
        }
        .tab.active { border-bottom-color: var(--primary); color: var(--primary); }

        .content { flex:1; padding:12px 12px 80px; }

        .search-box {
            width:100%; padding:10px 16px 10px 40px; border:2px solid var(--border);
            border-radius:24px; font-size:0.95rem; background:var(--input-bg);
            background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%237c3aed' stroke-width='2.5'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
            background-repeat:no-repeat; background-position:14px center;
        }
        .stats { font-size:0.85rem; color: var(--text-secondary); margin:8px 0; }

        .client-list, .entrega-list { display:flex; flex-direction:column; gap:8px; }
        .client-row, .entrega-row {
            background:var(--card); border:1px solid var(--border);
            border-radius:var(--radius); padding:14px;
            display:flex; align-items:center; gap:12px;
            box-shadow:var(--shadow); cursor:pointer;
        }
        .checkbox { width:20px; height:20px; accent-color: var(--primary); flex-shrink:0; }
        .info { flex:1; min-width:0; }
        .name { font-weight:600; font-size:0.95rem; }
        .detail { font-size:0.8rem; color:var(--text-secondary); }
        .badge { font-size:0.7rem; padding:2px 8px; border-radius:12px; font-weight:600; }
        .badge-pendente { background:#fff3cd; color:#856404; }
        .badge-entregue { background:#d4edda; color:#155724; }

        .fab {
            position:fixed; bottom:24px; right:24px;
            width:56px; height:56px; border-radius:50%;
            background: var(--primary); color: #fff; border:none;
            font-size:1.8rem; cursor:pointer; box-shadow:0 4px 16px rgba(124,58,237,0.4);
            z-index:200;
        }

        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.6);
            z-index:300; display:flex; align-items:flex-end; justify-content:center;
        }
        .modal-sheet {
            background:var(--card); width:100%; max-width:500px;
            max-height:92vh; border-radius:16px 16px 0 0;
            overflow-y:auto; padding-bottom:24px;
        }
        .modal-handle { width:36px; height:4px; background:#ccc; border-radius:2px; margin:12px auto 8px; }
        .modal-content { padding:0 20px 20px; }
        .form-group { margin-bottom:14px; }
        .form-label { display:block; font-size:0.75rem; font-weight:600; color:var(--text-secondary); margin-bottom:4px; text-transform:uppercase; }
        .form-input, .form-textarea {
            width:100%; padding:12px; border:2px solid var(--border);
            border-radius:var(--radius); font-size:0.95rem; background:var(--input-bg);
        }
        .btn { padding:12px; border-radius:var(--radius); font-weight:600; cursor:pointer; border:none; width:100%; font-size:0.95rem; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-outline { background:transparent; border:2px solid var(--primary); color: var(--primary); }
        .btn-danger { background:transparent; border:2px solid var(--danger); color: var(--danger); }
        .toast {
            position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
            background: var(--primary); color: #fff; padding:10px 22px; border-radius:20px;
            font-size:0.85rem; z-index:500;
        }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <div class="header" id="header" style="display:none;">
        <span class="header-title">🥗 Insalata Saladas</span>
        <button class="header-btn" onclick="handleLogout()" title="Sair">⏻</button>
    </div>
    <div class="tabs" id="tabs" style="display:none;">
        <div class="tab active" onclick="switchTab('clientes')">👥 Clientes</div>
        <div class="tab" onclick="switchTab('entregas')">📦 Entregas</div>
    </div>
    <div class="content" id="contentArea"></div>
    <button class="fab" id="fabMain" style="display:none;" onclick="handleFab()">+</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAH_F87WPWdg-kYLbcpgsxhVmi8Oq9ga3I",
        authDomain: "lista-cliente-cacau.firebaseapp.com",
        projectId: "lista-cliente-cacau",
        storageBucket: "lista-cliente-cacau.firebasestorage.app",
        messagingSenderId: "626280914294",
        appId: "1:626280914294:web:2277e036c0bcce3dcd2e57"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentTab = 'clientes';
    let allClients = [];
    let allEntregas = [];
    let unsubscribeClients = null;
    let unsubscribeEntregas = null;

    auth.onAuthStateChanged(user => {
        currentUser = user;
        if (user) {
            document.getElementById('header').style.display = 'flex';
            document.getElementById('tabs').style.display = 'flex';
            document.getElementById('fabMain').style.display = 'flex';
            loadData();
        } else {
            document.getElementById('header').style.display = 'none';
            document.getElementById('tabs').style.display = 'none';
            document.getElementById('fabMain').style.display = 'none';
            if (unsubscribeClients) unsubscribeClients();
            if (unsubscribeEntregas) unsubscribeEntregas();
            renderLogin();
        }
    });

    function loadData() {
        if (unsubscribeClients) unsubscribeClients();
        if (unsubscribeEntregas) unsubscribeEntregas();
        const uid = currentUser.uid;
        unsubscribeClients = db.collection('users').doc(uid).collection('clients')
            .orderBy('nome').onSnapshot(snap => {
                allClients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if (currentTab === 'clientes') renderClientes();
            });

        const hoje = new Date().toISOString().slice(0,10);
        // Removemos o orderBy para não exigir índice composto; ordenaremos localmente
        unsubscribeEntregas = db.collection('users').doc(uid).collection('entregas')
            .where('data', '==', hoje)
            .onSnapshot(snap => {
                allEntregas = snap.docs
                    .map(d => ({id: d.id, ...d.data()}))
                    .sort((a, b) => (a.criadoEm || '').localeCompare(b.criadoEm || ''));
                if (currentTab === 'entregas') renderEntregas();
            }, error => {
                console.error('Erro ao carregar entregas:', error);
                showToast('Erro ao carregar entregas. Tente recarregar.');
            });
    }

    function renderLogin() {
        document.getElementById('contentArea').innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:20px;">
                <div style="font-size:4rem;">🥗</div>
                <h2 style="color:var(--primary);">Insalata Saladas</h2>
                <div style="width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px;">
                    <input id="loginEmail" placeholder="Email" class="form-input">
                    <input id="loginPassword" type="password" placeholder="Senha" class="form-input">
                    <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>
                    <span style="text-align:center;font-size:0.85rem;cursor:pointer;color:var(--primary);" onclick="handleRegister()">Criar conta</span>
                </div>
            </div>`;
    }

    async function handleLogin() {
        const e = document.getElementById('loginEmail').value.trim();
        const p = document.getElementById('loginPassword').value;
        if (!e || !p) return showToast('Preencha email e senha.');
        try { await auth.signInWithEmailAndPassword(e,p); } catch (err) { showToast('Erro: '+err.message); }
    }

    async function handleRegister() {
        const e = document.getElementById('loginEmail').value.trim();
        const p = document.getElementById('loginPassword').value;
        if (!e || !p) return showToast('Preencha email e senha.');
        if (p.length<6) return showToast('Senha mínima de 6 caracteres.');
        try { await auth.createUserWithEmailAndPassword(e,p); showToast('Conta criada!'); } catch (err) { showToast('Erro: '+err.message); }
    }

    async function handleLogout() { await auth.signOut(); }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach((t,i) => {
            t.classList.toggle('active', (i===0 && tab==='clientes') || (i===1 && tab==='entregas'));
        });
        if (tab==='clientes') renderClientes();
        else renderEntregas();
    }

    function handleFab() {
        if (currentTab==='clientes') openNewClientModal();
        else openNewEntregaModal();
    }

    // ======== CLIENTES ========
    function renderClientes(search='') {
        let html = `<input class="search-box" placeholder="Buscar clientes..." value="${search}" oninput="renderClientes(this.value)">
                    <div class="stats">${allClients.length} clientes</div><div class="client-list">`;
        let filtered = allClients;
        if (search.trim()) {
            const s = search.trim().toLowerCase();
            filtered = allClients.filter(c => c.nome.toLowerCase().includes(s) || (c.telefone||'').includes(s));
        }
        if (filtered.length===0) html += `<div style="text-align:center;color:var(--text-secondary);">Nenhum cliente.</div>`;
        filtered.forEach(c => {
            html += `
                <div class="client-row">
                    <input type="checkbox" class="checkbox" data-id="${c.id}">
                    <div class="info" onclick="openEditClientModal('${c.id}')">
                        <div class="name">${c.nome||'Sem nome'}</div>
                        <div class="detail">${c.telefone||''} · Taxa: R$ ${(c.taxaEntrega||0).toFixed(2)}</div>
                    </div>
                </div>`;
        });
        html += `</div><button class="btn btn-primary" style="margin-top:12px;" onclick="criarEntregas()">➕ Criar Entregas</button>`;
        document.getElementById('contentArea').innerHTML = html;
    }

    async function criarEntregas() {
        const checks = document.querySelectorAll('.checkbox:checked');
        if (checks.length===0) return showToast('Selecione ao menos um cliente.');
        const hoje = new Date().toISOString().slice(0,10);
        const criadoEm = new Date().toISOString();
        const uid = currentUser.uid;
        const batch = db.batch();
        let count = 0;
        checks.forEach(cb => {
            const cid = cb.getAttribute('data-id');
            const cliente = allClients.find(c => c.id===cid);
            if (!cliente) return;
            const ref = db.collection('users').doc(uid).collection('entregas').doc();
            batch.set(ref, {
                clienteId: cid,
                nome: cliente.nome||'',
                endereco: cliente.endereco||'',
                complemento: cliente.complemento||'',
                enderecoTrabalho: cliente.enderecoTrabalho||'',
                complementoTrabalho: cliente.complementoTrabalho||'',
                enderecoSelecionado: 'residencial',
                valor: cliente.taxaEntrega || 0,
                pagamento: 'dinheiro',
                troco: '',
                status: 'pendente',
                data: hoje,
                criadoEm: criadoEm,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            count++;
        });
        await batch.commit();
        showToast(`${count} entregas criadas!`);
        switchTab('entregas');
    }

    // ======== ENTREGAS ========
    function renderEntregas() {
        let pendentes = allEntregas.filter(e => e.status==='pendente');
        let entregues = allEntregas.filter(e => e.status==='entregue');
        let html = `<div class="stats">📦 ${pendentes.length} pendentes · ✅ ${entregues.length} entregues</div><div class="entrega-list">`;
        [...pendentes, ...entregues].forEach(e => {
            const addr = e.enderecoSelecionado==='trabalho' ? (e.enderecoTrabalho||e.endereco) : e.endereco;
            const pag = e.pagamento==='dinheiro'?`Dinheiro${e.troco?' (Troco: R$'+e.troco+')':''}`:e.pagamento;
            html += `
                <div class="entrega-row">
                    <input type="checkbox" class="checkbox-entrega" data-id="${e.id}" ${e.status==='entregue'?'disabled':''}>
                    <div class="info" onclick="openEditEntregaModal('${e.id}')">
                        <div class="name">${e.nome} <span class="badge badge-${e.status}">${e.status}</span></div>
                        <div class="detail">${addr} · R$ ${parseFloat(e.valor||0).toFixed(2)} · ${pag}</div>
                    </div>
                </div>`;
        });
        html += `</div>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="gerarRota()">🗺️ Rota</button>
            <button class="btn btn-outline" style="margin-top:8px;" onclick="marcarEntregues()">✅ Marcar Entregues</button>`;
        document.getElementById('contentArea').innerHTML = html;
    }

    function gerarRota() {
        const checks = document.querySelectorAll('.checkbox-entrega:checked');
        if (checks.length===0) return showToast('Selecione as entregas para a rota.');
        const selecionadas = Array.from(checks).map(cb => allEntregas.find(e=>e.id===cb.getAttribute('data-id')));
        if (selecionadas.length>10) return showToast('Máximo 10 endereços.');
        const waypoints = selecionadas.map(e => {
            const addr = e.enderecoSelecionado==='trabalho' ? (e.enderecoTrabalho||e.endereco) : e.endereco;
            return encodeURIComponent(addr + (e.complemento?' '+e.complemento:''));
        });
        const destination = waypoints.pop();
        const url = `https://www.google.com/maps/dir/?api=1&destination=${destination}&waypoints=${waypoints.join('|')}&travelmode=driving`;
        window.open(url, '_blank');
    }

    async function marcarEntregues() {
        const checks = document.querySelectorAll('.checkbox-entrega:checked');
        if (checks.length===0) return showToast('Selecione as entregas.');
        const batch = db.batch();
        const uid = currentUser.uid;
        checks.forEach(cb => {
            const eid = cb.getAttribute('data-id');
            batch.update(db.collection('users').doc(uid).collection('entregas').doc(eid), {status:'entregue'});
        });
        await batch.commit();
        showToast('Entregas atualizadas!');
    }

    // ======== MODAIS ========
    function openNewClientModal() {
        showModal(`
            <div class="modal-handle"></div><div class="modal-content">
                <h3 style="color:var(--primary);">Novo Cliente</h3>
                <div class="form-group"><label class="form-label">Nome *</label><input class="form-input" id="cNome"></div>
                <div class="form-group"><label class="form-label">Telefone</label><input class="form-input" id="cTel"></div>
                <div class="form-group"><label class="form-label">Endereço Residencial</label><input class="form-input" id="cEnd"></div>
                <div class="form-group"><label class="form-label">Complemento</label><input class="form-input" id="cComp"></div>
                <div class="form-group"><label class="form-label">Endereço Trabalho</label><input class="form-input" id="cEndTrab"></div>
                <div class="form-group"><label class="form-label">Complemento Trab.</label><input class="form-input" id="cCompTrab"></div>
                <div class="form-group"><label class="form-label">Taxa de Entrega (R$)</label><input class="form-input" type="number" step="0.01" id="cTaxa" value="0"></div>
                <button class="btn btn-primary" onclick="saveNewClient()">Salvar</button>
                <button class="btn btn-outline" style="margin-top:6px;" onclick="closeModal()">Cancelar</button>
            </div>`);
    }

    async function saveNewClient() {
        const nome = document.getElementById('cNome').value.trim();
        if (!nome) return showToast('Nome obrigatório.');
        await db.collection('users').doc(currentUser.uid).collection('clients').add({
            nome, telefone: document.getElementById('cTel').value.trim(),
            endereco: document.getElementById('cEnd').value.trim(),
            complemento: document.getElementById('cComp').value.trim(),
            enderecoTrabalho: document.getElementById('cEndTrab').value.trim(),
            complementoTrabalho: document.getElementById('cCompTrab').value.trim(),
            taxaEntrega: parseFloat(document.getElementById('cTaxa').value) || 0
        });
        closeModal(); showToast('Cliente adicionado!');
    }

    function openEditClientModal(id) {
        const c = allClients.find(c=>c.id===id); if(!c) return;
        showModal(`
            <div class="modal-handle"></div><div class="modal-content">
                <h3 style="color:var(--primary);">Editar Cliente</h3>
                <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="eNome" value="${c.nome||''}"></div>
                <div class="form-group"><label class="form-label">Telefone</label><input class="form-input" id="eTel" value="${c.telefone||''}"></div>
                <div class="form-group"><label class="form-label">Endereço</label><input class="form-input" id="eEnd" value="${c.endereco||''}"></div>
                <div class="form-group"><label class="form-label">Complemento</label><input class="form-input" id="eComp" value="${c.complemento||''}"></div>
                <div class="form-group"><label class="form-label">End. Trabalho</label><input class="form-input" id="eEndTrab" value="${c.enderecoTrabalho||''}"></div>
                <div class="form-group"><label class="form-label">Comp. Trab.</label><input class="form-input" id="eCompTrab" value="${c.complementoTrabalho||''}"></div>
                <div class="form-group"><label class="form-label">Taxa de Entrega (R$)</label><input class="form-input" type="number" step="0.01" id="eTaxa" value="${c.taxaEntrega||0}"></div>
                <button class="btn btn-primary" onclick="updateClient('${id}')">Salvar</button>
                <button class="btn btn-danger" style="margin-top:6px;" onclick="deleteClient('${id}')">Excluir</button>
                <button class="btn btn-outline" style="margin-top:6px;" onclick="closeModal()">Cancelar</button>
            </div>`);
    }

    async function updateClient(id) {
        await db.collection('users').doc(currentUser.uid).collection('clients').doc(id).update({
            nome: document.getElementById('eNome').value.trim(),
            telefone: document.getElementById('eTel').value.trim(),
            endereco: document.getElementById('eEnd').value.trim(),
            complemento: document.getElementById('eComp').value.trim(),
            enderecoTrabalho: document.getElementById('eEndTrab').value.trim(),
            complementoTrabalho: document.getElementById('eCompTrab').value.trim(),
            taxaEntrega: parseFloat(document.getElementById('eTaxa').value) || 0
        });
        closeModal(); showToast('Cliente atualizado!');
    }

    async function deleteClient(id) {
        if (!confirm('Excluir cliente?')) return;
        await db.collection('users').doc(currentUser.uid).collection('clients').doc(id).delete();
        closeModal(); showToast('Cliente removido.');
    }

    function openNewEntregaModal() {
        let opts = allClients.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
        showModal(`
            <div class="modal-handle"></div><div class="modal-content">
                <h3 style="color:var(--primary);">Nova Entrega</h3>
                <div class="form-group"><label class="form-label">Cliente</label>
                    <select class="form-input" id="selCliente" onchange="preencherTaxa()">${opts}</select>
                </div>
                <div class="form-group"><label class="form-label">Endereço</label>
                    <select class="form-input" id="selEndereco"><option value="residencial">Residencial</option><option value="trabalho">Trabalho</option></select>
                </div>
                <div class="form-group"><label class="form-label">Valor (R$)</label><input class="form-input" type="number" step="0.01" id="entregaValor" value="0"></div>
                <div class="form-group"><label class="form-label">Pagamento</label>
                    <select class="form-input" id="entregaPgto" onchange="toggleTroco()">
                        <option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="pix">Pix</option>
                    </select>
                </div>
                <div class="form-group" id="grupoTroco"><label class="form-label">Troco (R$)</label><input class="form-input" type="number" step="0.01" id="entregaTroco"></div>
                <button class="btn btn-primary" onclick="saveNovaEntrega()">Salvar Entrega</button>
                <button class="btn btn-outline" style="margin-top:6px;" onclick="closeModal()">Cancelar</button>
            </div>`);
        setTimeout(preencherTaxa, 100);
    }

    function preencherTaxa() {
        const sel = document.getElementById('selCliente');
        const valInput = document.getElementById('entregaValor');
        if (!sel || !valInput) return;
        const cliente = allClients.find(c => c.id === sel.value);
        if (cliente) valInput.value = cliente.taxaEntrega || 0;
    }

    function toggleTroco() {
        const pgto = document.getElementById('entregaPgto')?.value;
        const grupo = document.getElementById('grupoTroco');
        if (grupo) grupo.style.display = pgto==='dinheiro'?'block':'none';
    }

    async function saveNovaEntrega() {
        const cid = document.getElementById('selCliente').value;
        const cliente = allClients.find(c=>c.id===cid);
        if (!cliente) return;
        const hoje = new Date().toISOString().slice(0,10);
        const criadoEm = new Date().toISOString();
        await db.collection('users').doc(currentUser.uid).collection('entregas').add({
            clienteId: cid,
            nome: cliente.nome,
            endereco: cliente.endereco||'',
            complemento: cliente.complemento||'',
            enderecoTrabalho: cliente.enderecoTrabalho||'',
            complementoTrabalho: cliente.complementoTrabalho||'',
            enderecoSelecionado: document.getElementById('selEndereco').value,
            valor: parseFloat(document.getElementById('entregaValor').value)||0,
            pagamento: document.getElementById('entregaPgto').value,
            troco: document.getElementById('entregaTroco')?.value||'',
            status: 'pendente',
            data: hoje,
            criadoEm: criadoEm,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal(); showToast('Entrega adicionada!');
    }

    function openEditEntregaModal(id) {
        const e = allEntregas.find(e=>e.id===id); if (!e) return;
        showModal(`
            <div class="modal-handle"></div><div class="modal-content">
                <h3 style="color:var(--primary);">Editar Entrega</h3>
                <div class="form-group"><label class="form-label">Endereço</label>
                    <select class="form-input" id="editEndereco">
                        <option value="residencial" ${e.enderecoSelecionado==='residencial'?'selected':''}>Residencial</option>
                        <option value="trabalho" ${e.enderecoSelecionado==='trabalho'?'selected':''}>Trabalho</option>
                    </select>
                </div>
                <div class="form-group"><label class="form-label">Valor</label><input class="form-input" type="number" step="0.01" id="editValor" value="${e.valor||0}"></div>
                <div class="form-group"><label class="form-label">Pagamento</label>
                    <select class="form-input" id="editPgto">
                        <option value="dinheiro" ${e.pagamento==='dinheiro'?'selected':''}>Dinheiro</option>
                        <option value="cartao" ${e.pagamento==='cartao'?'selected':''}>Cartão</option>
                        <option value="pix" ${e.pagamento==='pix'?'selected':''}>Pix</option>
                    </select>
                </div>
                <div class="form-group"><label class="form-label">Troco</label><input class="form-input" type="number" step="0.01" id="editTroco" value="${e.troco||''}"></div>
                <button class="btn btn-primary" onclick="updateEntrega('${id}')">Salvar</button>
                <button class="btn btn-danger" style="margin-top:6px;" onclick="deleteEntrega('${id}')">Excluir</button>
                <button class="btn btn-outline" style="margin-top:6px;" onclick="closeModal()">Cancelar</button>
            </div>`);
    }

    async function updateEntrega(id) {
        await db.collection('users').doc(currentUser.uid).collection('entregas').doc(id).update({
            enderecoSelecionado: document.getElementById('editEndereco').value,
            valor: parseFloat(document.getElementById('editValor').value)||0,
            pagamento: document.getElementById('editPgto').value,
            troco: document.getElementById('editTroco').value
        });
        closeModal(); showToast('Entrega atualizada!');
    }

    async function deleteEntrega(id) {
        if (!confirm('Excluir entrega?')) return;
        await db.collection('users').doc(currentUser.uid).collection('entregas').doc(id).delete();
        closeModal(); showToast('Entrega removida.');
    }

    function showModal(html) {
        const overlay = document.createElement('div'); overlay.className='modal-overlay'; overlay.id='modalOverlay';
        overlay.innerHTML = `<div class="modal-sheet">${html}</div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', e => { if (e.target===overlay) closeModal(); });
        document.body.style.overflow='hidden';
    }

    function closeModal() {
        const ov = document.getElementById('modalOverlay'); if (ov) ov.remove();
        document.body.style.overflow='';
        if (currentTab==='clientes') renderClientes();
        else renderEntregas();
    }

    function showToast(msg) {
        const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
        document.body.appendChild(t); setTimeout(()=>t.remove(), 2500);
    }
</script>
</body>
</html>
