<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>App dos Clientes</title>
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22App%20dos%20Clientes%22%2C%22short_name%22%3A%22Clientes%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000%22%2C%22theme_color%22%3A%22%23000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23000' width='100' height='100' rx='20'/%3E%3Ccircle cx='35' cy='35' r='12' fill='white'/%3E%3Ccircle cx='65' cy='35' r='12' fill='white'/%3E%3Cellipse cx='35' cy='75' rx='16' ry='18' fill='white'/%3E%3Cellipse cx='65' cy='75' rx='16' ry='18' fill='white'/%3E%3C/svg%3E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image/svg+xml%22%7D%5D%7D">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Clientes">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23000' width='100' height='100' rx='20'/><circle cx='35' cy='35' r='12' fill='white'/><circle cx='65' cy='35' r='12' fill='white'/><ellipse cx='35' cy='75' rx='16' ry='18' fill='white'/><ellipse cx='65' cy='75' rx='16' ry='18' fill='white'/></svg>">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #121212;
            --bg-secondary: #1e1e1e;
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: #333;
            --card: #1e1e1e;
            --shadow: 0 2px 8px rgba(0,0,0,0.4);
            --input-bg: #2a2a2a;
            --radius: 10px;
            --danger: #ff4444;
            --accent: #ffffff;
            --accent-text: #000;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f5f5f5;
                --bg-secondary: #fff;
                --text: #1a1a1a;
                --text-secondary: #666;
                --border: #ddd;
                --card: #fff;
                --shadow: 0 2px 8px rgba(0,0,0,0.1);
                --input-bg: #fff;
            }
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; -webkit-tap-highlight-color: transparent;
        }
        .app-container { max-width:500px; margin:0 auto; display:flex; flex-direction:column; min-height:100vh; }

        .header {
            background: #000; color: #fff;
            padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; z-index:100;
        }
        .header-title { font-size:1.1rem; font-weight:700; }
        .header-btn { background:rgba(255,255,255,0.2); color:inherit; border:none; width:36px; height:36px; border-radius:50%; font-size:1.2rem; cursor:pointer; }

        .tabs {
            display:flex; background: var(--bg-secondary);
            position:sticky; top:52px; z-index:90;
        }
        .tab {
            flex:1; text-align:center; padding:12px;
            font-weight:600; font-size:0.9rem; border-bottom:2px solid transparent;
            cursor:pointer; transition:0.2s; color: var(--text-secondary);
        }
        .tab.active { border-bottom-color: var(--accent); color: var(--text); }

        .content { flex:1; padding:12px 12px 80px; }

        .search-box {
            width:100%; padding:10px 16px 10px 40px; border:2px solid var(--border);
            border-radius:24px; font-size:0.95rem; background:var(--input-bg); color:var(--text);
            background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%23aaa' stroke-width='2.5'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
            background-repeat:no-repeat; background-position:14px center;
        }
        .stats { font-size:0.85rem; color: var(--text-secondary); margin:8px 0; }

        .client-list, .entrega-list { display:flex; flex-direction:column; gap:8px; }
        .client-row, .entrega-row {
            background:var(--card); border:1px solid var(--border);
            border-radius:var(--radius); padding:14px;
            display:flex; align-items:center; gap:12px;
            box-shadow:var(--shadow); cursor:pointer;
            border-left: 4px solid var(--border);
            position: relative;
        }
        .entrega-row.apagar { border-left-color: #ffc107; }
        .entrega-row.pago { border-left-color: #4caf50; }

        .checkbox { width:20px; height:20px; accent-color: var(--accent); flex-shrink:0; }
        .info { flex:1; min-width:0; }
        .name { font-weight:600; font-size:0.95rem; color: var(--text); }
        .detail { font-size:0.8rem; color: var(--text-secondary); }
        .badge { font-size:0.7rem; padding:2px 8px; border-radius:12px; font-weight:600; }
        .badge-pendente { background:#fff3cd; color:#856404; }
        .badge-entregue { background:#d4edda; color:#155724; }
        .badge-pago { background:#d4edda; color:#155724; }
        .badge-apagar { background:#ffeeba; color:#856404; }

        .fab {
            position:fixed; bottom:24px; right:24px;
            width:56px; height:56px; border-radius:50%;
            background: var(--accent); color: var(--accent-text); border:none;
            font-size:1.8rem; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,0.3);
            z-index:200;
        }

        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.7);
            z-index:300; display:flex; align-items:flex-end; justify-content:center;
        }
        .modal-sheet {
            background:var(--card); width:100%; max-width:500px;
            max-height:92vh; border-radius:16px 16px 0 0;
            overflow-y:auto; padding-bottom:24px;
        }
        .modal-handle { width:36px; height:4px; background:#555; border-radius:2px; margin:12px auto 8px; }
        .modal-content { padding:0 20px 20px; }
        .form-group { margin-bottom:14px; }
        .form-label { display:block; font-size:0.75rem; font-weight:600; color: var(--text-secondary); margin-bottom:4px; text-transform:uppercase; }
        .form-input, .form-textarea {
            width:100%; padding:12px; border:2px solid var(--border);
            border-radius:var(--radius); font-size:0.95rem; background:var(--input-bg); color:var(--text);
        }
        .btn { padding:12px; border-radius:var(--radius); font-weight:600; cursor:pointer; border:none; width:100%; font-size:0.95rem; }
        .btn-primary { background: var(--accent); color: var(--accent-text); }
        .btn-outline { background:transparent; border:2px solid var(--accent); color: var(--accent); }
        .btn-danger { background:transparent; border:2px solid var(--danger); color: var(--danger); }
        .toast {
            position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
            background: var(--accent); color: var(--accent-text); padding:10px 22px; border-radius:20px;
            font-size:0.85rem; z-index:500;
        }
        .info-troco { font-size:0.8rem; color: var(--accent); margin-top:4px; }

        .seta-ordenacao {
            display: flex; flex-direction: column; gap: 4px; margin-left: 8px;
        }
        .seta-btn {
            background: none; border: none; color: var(--text-secondary); font-size: 1rem;
            cursor: pointer; padding: 0 4px; line-height: 1;
        }
        .seta-btn:active { color: var(--accent); }

        .grupo-select {
            display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
        }
        .grupo-select select {
            padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px;
            background: var(--input-bg); color: var(--text); font-size: 0.9rem;
        }
        .relatorio-grupos {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 12px;
            margin-bottom: 12px; font-size: 0.85rem;
        }

        /* Autocomplete */
        .autocomplete-container {
            position: relative;
        }
        .sugestoes-lista {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 var(--radius) var(--radius);
            max-height: 180px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }
        .sugestao-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
        }
        .sugestao-item:last-child { border-bottom: none; }
        .sugestao-item:hover, .sugestao-item:active { background: var(--input-bg); }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <div class="header" id="header" style="display:none;">
        <span class="header-title">👥 App dos Clientes</span>
        <button class="header-btn" onclick="handleLogout()" title="Sair">⏻</button>
    </div>
    <div class="tabs" id="tabs" style="display:none;">
        <div class="tab active" onclick="switchTab('entregas')">📦 Entregas</div>
        <div class="tab" onclick="switchTab('clientes')">👥 Clientes</div>
    </div>
    <div class="content" id="contentArea"></div>
    <button class="fab" id="fabMain" style="display:none;" onclick="handleFab()">+</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAH_F87WPWdg-kYLbcpgsxhVmi8Oq9ga3I",
        authDomain: "lista-cliente-cacau.firebaseapp.com",
        projectId: "lista-cliente-cacau",
        storageBucket: "lista-cliente-cacau.firebasestorage.app",
        messagingSenderId: "626280914294",
        appId: "1:626280914294:web:2277e036c0bcce3dcd2e57"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentTab = 'entregas';
    let allClients = [];
    let allEntregas = [];
    let unsubscribeClients = null;
    let unsubscribeEntregas = null;
    let selectedGroupClientes = 'Todos';
    let selectedGroupEntregas = 'Todos';

    auth.onAuthStateChanged(user => {
        currentUser = user;
        if (user) {
            document.getElementById('header').style.display = 'flex';
            document.getElementById('tabs').style.display = 'flex';
            document.getElementById('fabMain').style.display = 'flex';
            loadData();
        } else {
            document.getElementById('header').style.display = 'none';
            document.getElementById('tabs').style.display = 'none';
            document.getElementById('fabMain').style.display = 'none';
            if (unsubscribeClients) unsubscribeClients();
            if (unsubscribeEntregas) unsubscribeEntregas();
            renderLogin();
        }
    });

    function loadData() {
        if (unsubscribeClients) unsubscribeClients();
        if (unsubscribeEntregas) unsubscribeEntregas();
        const uid = currentUser.uid;
        unsubscribeClients = db.collection('users').doc(uid).collection('clients')
            .orderBy('nome').onSnapshot(snap => {
                allClients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if (currentTab === 'clientes') renderClientes();
            });

        const hoje = new Date().toISOString().slice(0,10);
        unsubscribeEntregas = db.collection('users').doc(uid).collection('entregas')
            .where('data', '==', hoje)
            .onSnapshot(snap => {
                allEntregas = snap.docs
                    .map(d => ({id: d.id, ...d.data()}))
                    .sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0) || (a.criadoEm || '').localeCompare(b.criadoEm || ''));
                if (currentTab === 'entregas') renderEntregas();
            }, error => {
                console.error('Erro ao carregar entregas:', error);
                showToast('Erro ao carregar entregas. Tente recarregar.');
            });
    }

    function renderLogin() {
        document.getElementById('contentArea').innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:20px;">
                <div style="font-size:4rem;">👥</div>
                <h2>App dos Clientes</h2>
                <div style="width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px;">
                    <input id="loginEmail" placeholder="Email" class="form-input">
                    <input id="loginPassword" type="password" placeholder="Senha" class="form-input">
                    <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>
                    <span style="text-align:center;font-size:0.85rem;cursor:pointer;" onclick="handleRegister()">Criar conta</span>
                </div>
            </div>`;
    }

    async function handleLogin() {
        const e = document.getElementById('loginEmail').value.trim();
        const p = document.getElementById('loginPassword').value;
        if (!e || !p) return showToast('Preencha email e senha.');
        try { await auth.signInWithEmailAndPassword(e,p); } catch (err) { showToast('Erro: '+err.message); }
    }

    async function handleRegister() {
        const e = document.getElementById('loginEmail').value.trim();
        const p = document.getElementById('loginPassword').value;
        if (!e || !p) return showToast('Preencha email e senha.');
        if (p.length<6) return showToast('Senha mínima de 6 caracteres.');
        try { await auth.createUserWithEmailAndPassword(e,p); showToast('Conta criada!'); } catch (err) { showToast('Erro: '+err.message); }
    }

    async function handleLogout() { await auth.signOut(); }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach((t,i) => {
            t.classList.toggle('active', (i===0 && tab==='entregas') || (i===1 && tab==='clientes'));
        });
        if (tab==='clientes') renderClientes();
        else renderEntregas();
    }

    function handleFab() {
        if (currentTab==='clientes') openNewClientModal();
        else openNewEntregaModal();
    }

    // ======== CLIENTES ========
    function getUniqueGroups() {
        const groups = new Set();
        allClients.forEach(c => { if (c.grupo) groups.add(c.grupo); });
        return Array.from(groups).sort();
    }

    function renderClientes(searchTerm = '') {
        const search = searchTerm || document.getElementById('searchInput')?.value || '';
        const groups = getUniqueGroups();

        let html = `
            <div class="grupo-select">
                <select id="grupoFilterClientes" onchange="changeGroupClientes(this.value)">
                    <option value="Todos" ${selectedGroupClientes==='Todos'?'selected':''}>Todos</option>
                    ${groups.map(g => `<option value="${g}" ${selectedGroupClientes===g?'selected':''}>${g}</option>`).join('')}
                </select>
            </div>
            <input class="search-box" id="searchInput" placeholder="Buscar clientes..." value="${search}" oninput="renderClientes(this.value)">
            <div class="stats">${allClients.length} clientes</div><div class="client-list">`;

        let filtered = allClients;
        if (selectedGroupClientes !== 'Todos') {
            filtered = filtered.filter(c => c.grupo === selectedGroupClientes);
        }
        if (search.trim()) {
            const s = search.trim().toLowerCase();
            filtered = filtered.filter(c => c.nome.toLowerCase().includes(s) || (c.telefone||'').includes(s));
        }
        if (filtered.length===0) html += `<div style="text-align:center;color:var(--text-secondary);">Nenhum cliente.</div>`;
        filtered.forEach(c => {
            html += `
                <div class="client-row">
                    <input type="checkbox" class="client-checkbox" data-id="${c.id}">
                    <div class="info" onclick="openEditClientModal('${c.id}')">
                        <div class="name">${c.nome||'Sem nome'} ${c.grupo ? `<small>(${c.grupo})</small>` : ''}</div>
                        <div class="detail">${c.telefone||''} · Taxa: R$ ${(c.taxaEntrega||0).toFixed(2)}</div>
                    </div>
                </div>`;
        });
        html += `</div><button class="btn btn-primary" style="margin-top:12px;" onclick="criarEntregas()">➕ Criar Entregas</button>`;
        document.getElementById('contentArea').innerHTML = html;

        if (search) {
            setTimeout(() => {
                const si = document.getElementById('searchInput');
                if (si) {
                    si.focus();
                    si.setSelectionRange(si.value.length, si.value.length);
                }
            }, 50);
        }
    }

    function changeGroupClientes(group) {
        selectedGroupClientes = group;
        renderClientes();
    }

    async function criarEntregas() {
        const checks = document.querySelectorAll('.client-checkbox:checked');
        if (checks.length===0) return showToast('Selecione ao menos um cliente.');
        const hoje = new Date().toISOString().slice(0,10);
        const criadoEm = new Date().toISOString();
        const uid = currentUser.uid;
        const maxOrdem = allEntregas.reduce((max, e) => Math.max(max, e.ordem || 0), 0);
        const batch = db.batch();
        let count = 0;
        checks.forEach(cb => {
            const cid = cb.getAttribute('data-id');
            const cliente = allClients.find(c => c.id===cid);
            if (!cliente) return;
            const ref = db.collection('users').doc(uid).collection('entregas').doc();
            batch.set(ref, {
                clienteId: cid,
                nome: cliente.nome||'',
                grupo: cliente.grupo || '',
                endereco: cliente.endereco||'',
                complemento: cliente.complemento||'',
                enderecoTrabalho: cliente.enderecoTrabalho||'',
                complementoTrabalho: cliente.complementoTrabalho||'',
                enderecoSelecionado: 'residencial',
                valor: cliente.taxaEntrega || 0,
                totalPedido: 0,
                pagamento: 'dinheiro',
                troco: '',
                statusPagamento: 'apagar',
                status: 'pendente',
                data: hoje,
                criadoEm: criadoEm,
                ordem: maxOrdem + count + 1,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            count++;
        });
        await batch.commit();
        showToast(`${count} entregas criadas!`);
        switchTab('entregas');
    }

    // ======== ENTREGAS ========
    function getUniqueGroupsFromEntregas() {
        const groups = new Set();
        allEntregas.forEach(e => { if (e.grupo) groups.add(e.grupo); });
        return Array.from(groups).sort();
    }

    function renderEntregas() {
        const groups = getUniqueGroupsFromEntregas();
        const pendentes = allEntregas.filter(e => e.status==='pendente');
        const entregues = allEntregas.filter(e => e.status==='entregue');

        let filteredEntregas = allEntregas;
        if (selectedGroupEntregas !== 'Todos') {
            filteredEntregas = allEntregas.filter(e => e.grupo === selectedGroupEntregas);
        }
        const filteredPendentes = filteredEntregas.filter(e => e.status==='pendente');
        const filteredEntregues = filteredEntregas.filter(e => e.status==='entregue');

        const totalTaxaGeral = allEntregas.reduce((acc, e) => acc + (parseFloat(e.valor)||0), 0);

        const mapaGrupos = {};
        allEntregas.forEach(e => {
            const g = e.grupo || 'Sem grupo';
            mapaGrupos[g] = (mapaGrupos[g] || 0) + (parseFloat(e.valor)||0);
        });

        let html = `
            <div class="grupo-select">
                <select id="grupoFilterEntregas" onchange="changeGroupEntregas(this.value)">
                    <option value="Todos" ${selectedGroupEntregas==='Todos'?'selected':''}>Todos</option>
                    ${groups.map(g => `<option value="${g}" ${selectedGroupEntregas===g?'selected':''}>${g}</option>`).join('')}
                </select>
            </div>
            <div class="stats">📦 ${filteredPendentes.length} pendentes · ✅ ${filteredEntregues.length} entregues</div>
            <div class="stats" style="font-weight:bold;">💰 Sua diária (taxas): R$ ${totalTaxaGeral.toFixed(2)}</div>
            <div class="relatorio-grupos">
                ${Object.entries(mapaGrupos).map(([g, v]) => `<div>${g}: R$ ${v.toFixed(2)}</div>`).join(' · ')}
            </div>
            <div class="entrega-list">`;

        [...filteredPendentes, ...filteredEntregues].forEach((e, index) => {
            const addr = e.enderecoSelecionado==='trabalho' ? (e.enderecoTrabalho||e.endereco) : e.endereco;
            const pagStatus = e.statusPagamento==='pago' ? 'Pago' : 'A pagar';
            const classeStatus = e.statusPagamento==='pago' ? 'pago' : 'apagar';
            const badgeClass = e.statusPagamento==='pago' ? 'badge-pago' : 'badge-apagar';
            const taxa = parseFloat(e.valor||0).toFixed(2);
            const totalPedido = parseFloat(e.totalPedido||0).toFixed(2);
            let pagInfo = '';
            if (e.statusPagamento === 'pago') {
                pagInfo = 'Pago';
            } else {
                pagInfo = `${e.pagamento || '?'} · <span class="badge ${badgeClass}">${pagStatus}</span>`;
            }
            const totalCobrar = e.statusPagamento==='apagar' ? totalPedido : '0.00';

            html += `
                <div class="entrega-row ${classeStatus}">
                    <input type="checkbox" class="entrega-checkbox" data-id="${e.id}" ${e.status==='entregue'?'disabled':''}>
                    <div class="info" onclick="openEditEntregaModal('${e.id}')">
                        <div class="name">${e.nome} <span class="badge badge-${e.status}">${e.status}</span></div>
                        <div class="detail">${addr}</div>
                        <div class="detail">Taxa: R$ ${taxa} ${e.statusPagamento==='apagar' ? '· Total Pedido: R$ ' + totalPedido : ''} · ${pagInfo}</div>
                        <div class="detail" style="font-weight:bold;">Cobrar: R$ ${totalCobrar}</div>
                    </div>
                    ${e.status === 'pendente' ? `
                    <div class="seta-ordenacao">
                        <button class="seta-btn" onclick="moverEntrega('${e.id}', -1); event.stopPropagation();" ${index === 0 ? 'disabled' : ''}>⬆️</button>
                        <button class="seta-btn" onclick="moverEntrega('${e.id}', 1); event.stopPropagation();" ${index === filteredPendentes.length-1 ? 'disabled' : ''}>⬇️</button>
                    </div>` : ''}
                </div>`;
        });
        html += `</div>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="gerarRota()">🗺️ Rota</button>
            <button class="btn btn-outline" style="margin-top:8px;" onclick="marcarEntregues()">✅ Marcar Entregues</button>`;
        document.getElementById('contentArea').innerHTML = html;

    async function moverEntrega(id, direction) {
        const index = allEntregas.findIndex(e => e.id === id);
        if (index === -1) return;
        const pendentes = allEntregas.filter(e => e.status === 'pendente');
        const idxPendente = pendentes.findIndex(e => e.id === id);
        if (idxPendente === -1) return;

        const targetIdx = idxPendente + direction;
        if (targetIdx < 0 || targetIdx >= pendentes.length) return;

        const entregaA = pendentes[idxPendente];
        const entregaB = pendentes[targetIdx];

        const ordemA = entregaA.ordem || 0;
        const ordemB = entregaB.ordem || 0;

        const batch = db.batch();
        const uid = currentUser.uid;
        batch.update(db.collection('users').doc(uid).collection('entregas').doc(entregaA.id), { ordem: ordemB });
        batch.update(db.collection('users').doc(uid).collection('entregas').doc(entregaB.id), { ordem: ordemA });
        await batch.commit();
    }

    function gerarRota() {
        const checks = document.querySelectorAll('.entrega-checkbox:checked');
        if (checks.length===0) return showToast('Selecione as entregas para a rota.');
        const selecionadas = Array.from(checks).map(cb => allEntregas.find(e=>e.id===cb.getAttribute('data-id')));
        if (selecionadas.length>10) return showToast('Máximo 10 endereços.');
        const waypoints = selecionadas.map(e => {
            const addr = e.enderecoSelecionado==='trabalho' ? (e.enderecoTrabalho||e.endereco) : e.endereco;
            return encodeURIComponent(addr + (e.complemento?' '+e.complemento:''));
        });
        const destination = waypoints.pop();
        const url = `https://www.google.com/maps/dir/?api=1&destination=${destination}&waypoints=${waypoints.join('|')}&travelmode=driving`;
        window.open(url, '_blank');
    }

    async function marcarEntregues() {
        const checks = document.querySelectorAll('.entrega-checkbox:checked');
        if (checks.length===0) return showToast('Selecione as entregas.');
        const batch = db.batch();
        const uid = currentUser.uid;
        checks.forEach(cb => {
            const eid = cb.getAttribute('data-id');
            batch.update(db.collection('users').doc(uid).collection('entregas').doc(eid), {status:'entregue'});
        });
        await batch.commit();
        showToast('Entregas atualizadas!');
    }

    function filtrarSugestoesGrupo(inputId, sugestoesId) {
        const input = document.getElementById(inputId);
        const lista = document.getElementById(sugestoesId);
        if (!input || !lista) return;
        const termo = input.value.trim().toLowerCase();
        const grupos = getUniqueGroups();
        const sugestoes = termo ? grupos.filter(g => g.toLowerCase().includes(termo)) : grupos;
        if (sugestoes.length === 0 || (sugestoes.length === 1 && sugestoes[0] === termo)) {
            lista.style.display = 'none';
            return;
        }
        lista.innerHTML = sugestoes.map(g => `<div class="sugestao-item" onclick="selecionarSugestao('${inputId}', '${sugestoesId}', '${g}')">${g}</div>`).join('');
        lista.style.display = 'block';
    }

    function selecionarSugestao(inputId, sugestoesId, valor) {
        const input = document.getElementById(inputId);
        const lista = document.getElementById(sugestoesId);
        if (input) input.value = valor;
        if (lista) lista.style.display = 'none';
    }

        if (grupoTotal) grupoTotal.style.display = status === 'apagar' ? 'block' : 'none';

    async function saveNovaEntrega() {
        const cid = document.getElementById('selCliente').value;
        const cliente = allClients.find(c=>c.id===cid);
        if (!cliente) return;
        const hoje = new Date().toISOString().slice(0,10);
        const criadoEm = new Date().toISOString();
        const statusPgto = document.getElementById('statusPagamentoNew').value;
        const taxa = parseFloat(document.getElementById('taxaValor').value)||0;
        const totalPedido = statusPgto === 'apagar' ? (parseFloat(document.getElementById('totalPedidoNew')?.value)||0) : 0;
        const forma = statusPgto === 'pago' ? '' : document.getElementById('formaPgtoNew').value;
        const troco = (statusPgto === 'apagar' && forma === 'dinheiro') ? (document.getElementById('trocoNew')?.value || '') : '';

        const maxOrdem = allEntregas.reduce((max, e) => Math.max(max, e.ordem || 0), 0);
        await db.collection('users').doc(currentUser.uid).collection('entregas').add({
            clienteId: cid,
            nome: cliente.nome,
            grupo: cliente.grupo || '',
            endereco: cliente.endereco||'',
            complemento: cliente.complemento||'',
            enderecoTrabalho: cliente.enderecoTrabalho||'',
            complementoTrabalho: cliente.complementoTrabalho||'',
            enderecoSelecionado: document.getElementById('selEndereco').value,
            valor: taxa,
            totalPedido: totalPedido,
            pagamento: forma,
            troco: troco,
            statusPagamento: statusPgto,
            status: 'pendente',
            data: hoje,
            criadoEm: criadoEm,
            ordem: maxOrdem + 1,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal(); showToast('Entrega adicionada!');
    }

    async function updateEntrega(id) {
        const statusPgto = document.getElementById('editStatusPagamento').value;

        const totalPedido = statusPgto === 'apagar' ? (parseFloat(document.getElementById('editTotalPedido')?.value)||0) : 0;
        const forma = statusPgto === 'pago' ? '' : document.getElementById('editFormaPgto').value;

    async function deleteEntrega(id) {
        if (!confirm('Excluir entrega?')) return;

        closeModal(); showToast('Entrega removida.');
    }

    function showModal(html) {
        const overlay = document.createElement('div'); overlay.className='modal-overlay'; overlay.id='modalOverlay';
        overlay.innerHTML = `<div class="modal-sheet">${html}</div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', e => { if (e.target===overlay) closeModal(); });
        document.body.style.overflow='hidden';
    }

    function closeModal() {
        const ov = document.getElementById('modalOverlay'); if (ov) ov.remove();
        document.body.style.overflow='';
        if (currentTab==='clientes') renderClientes();
        else renderEntregas();
    }

    function showToast(msg) {
        const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
        document.body.appendChild(t); setTimeout(()=>t.remove(), 2500);
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => self.clients.claim()); self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        });
    }
